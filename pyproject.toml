[project]
name = "aws-dbt-snowflake"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shivarajan918", email = "shiva.rajan918@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.1",
    "dbt-core>=1.12.3",
    "dbt-snowflake>=1.12.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "snowflake-connector-python>=4.7.2",
    "streamlit>=1.64.0",
]

[project.scripts]
aws-dbt-snowflake = "aws_dbt_snowflake:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
